<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SameGame examples</title>
        <style>body{justify-content:center;font-family:system-ui;display:flex}main{text-align:center;width:700px}.buttons{margin-bottom:20px}button{margin:6px;padding:6px 12px}#description{font-size:14px;line-height:1.4}#board{margin:20px auto;display:inline-block}.row{justify-content:center;display:flex}.cell{border:1px solid #ccc;width:32px;height:32px}.cell.highlight{box-shadow:inset 0 0 0 2px #0009,inset 0 0 10px #00000059}#controls{margin-top:10px}#log{text-align:left;margin-top:20px}button{cursor:pointer;margin:6px;padding:6px 12px}button.active{color:#fff;background:#2c3e50}</style>
      <script type="module" crossorigin src="/samegame-engine/assets/demo-DPf5w-OW.js"></script>
    </head>
    <body>
        <main>
            <h1>SameGame Examples</h1>
            <div class="buttons">
                <button class="example" data-example="basic">Basic</button>
                <button class="example" data-example="complexTiles">Complex tiles</button>
                <button class="example" data-example="region">Region</button>
                <button class="example" data-example="remove">Remove</button>
                <button class="example" data-example="gravity">Gravity</button>
                <button class="example" data-example="rotate">Rotate</button>
                <button class="example" data-example="endless">Endless</button>
            </div>
            <div id="description"></div>
            <div id="board"></div>
            <div id="controls">
                <button class="gravity" data-gravity="up">Up</button>
                <button class="gravity" data-gravity="right">Right</button>
                <button class="gravity active" data-gravity="down">Down</button>
                <button class="gravity" data-gravity="left">Left</button>
            </div>
            <div id="rotation">
                <button class="rotate" data-rotation="clockwise">Rotate Clockwise</button>
                <button class="rotate" data-rotation="counter-clockwise">Rotate Counter-Clockwise</button>
            </div>
            <div id="log"></div>
        </main>
    </body>
</html>
